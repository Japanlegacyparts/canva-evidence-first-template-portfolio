<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Vehicle parts verification checklist story">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFCF7"/><stop offset="1" stop-color="#FFF7ED"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102A43" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#wash)"/>
  
      <rect x="0" y="0" width="1080" height="360" fill="#102A43"/>
      <rect x="70" y="66" width="300" height="54" rx="27" fill="#FF6B35"/><text x="220" y="102" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">FIELD CHECKLIST</text>
      <text x="70" y="190" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#FFFFFF" text-anchor="start">Before you say</text><text x="70" y="274" font-family="Georgia, serif" font-size="94" font-weight="700" fill="#FFFFFF" text-anchor="start">“it fits”</text>
      <text x="72" y="332" font-family="Trebuchet MS, sans-serif" font-size="27" font-weight="400" fill="#BCCCDC" text-anchor="start" letter-spacing="0">Five checks that protect the decision</text>
      <circle cx="112" cy="450" r="42" fill="#2F6BFF"/><text x="112" y="460" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">01</text><text x="190" y="442" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#172B4D" text-anchor="start" letter-spacing="0">IDENTIFY THE VEHICLE</text><text x="190" y="488" font-family="Trebuchet MS, sans-serif" font-size="23" font-weight="400" fill="#627D98" text-anchor="start" letter-spacing="0">Market, chassis, engine, production month</text><line x1="190" y1="534" x2="978" y2="534" stroke="#D9E2EC" stroke-width="2"/><circle cx="112" cy="695" r="42" fill="#2F6BFF"/><text x="112" y="705" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">02</text><text x="190" y="687" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#172B4D" text-anchor="start" letter-spacing="0">PIN THE PART NUMBER</text><text x="190" y="733" font-family="Trebuchet MS, sans-serif" font-size="23" font-weight="400" fill="#627D98" text-anchor="start" letter-spacing="0">Brand, revision, supersession</text><line x1="190" y1="779" x2="978" y2="779" stroke="#D9E2EC" stroke-width="2"/><circle cx="112" cy="940" r="42" fill="#2F6BFF"/><text x="112" y="950" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">03</text><text x="190" y="932" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#172B4D" text-anchor="start" letter-spacing="0">FIND A PRIMARY SOURCE</text><text x="190" y="978" font-family="Trebuchet MS, sans-serif" font-size="23" font-weight="400" fill="#627D98" text-anchor="start" letter-spacing="0">Manufacturer or regulator evidence</text><line x1="190" y1="1024" x2="978" y2="1024" stroke="#D9E2EC" stroke-width="2"/><circle cx="112" cy="1185" r="42" fill="#2F6BFF"/><text x="112" y="1195" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">04</text><text x="190" y="1177" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#172B4D" text-anchor="start" letter-spacing="0">LOG CONTRADICTIONS</text><text x="190" y="1223" font-family="Trebuchet MS, sans-serif" font-size="23" font-weight="400" fill="#627D98" text-anchor="start" letter-spacing="0">Anything that narrows the claim</text><line x1="190" y1="1269" x2="978" y2="1269" stroke="#D9E2EC" stroke-width="2"/><circle cx="112" cy="1430" r="42" fill="#FF6B35"/><text x="112" y="1440" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="0">05</text><text x="190" y="1422" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="800" fill="#172B4D" text-anchor="start" letter-spacing="0">STATE THE DECISION</text><text x="190" y="1468" font-family="Trebuchet MS, sans-serif" font-size="23" font-weight="400" fill="#627D98" text-anchor="start" letter-spacing="0">Supported, conditional, or rejected</text><line x1="190" y1="1514" x2="978" y2="1514" stroke="#D9E2EC" stroke-width="2"/>
      <rect x="70" y="1690" width="940" height="150" rx="28" fill="#102A43"/>
      <text x="540" y="1762" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">Evidence beats confidence.</text>
      <text x="540" y="1810" font-family="Trebuchet MS, sans-serif" font-size="23" font-weight="400" fill="#BCCCDC" text-anchor="middle" letter-spacing="0">Save the source trail with the result.</text>
    
</svg>