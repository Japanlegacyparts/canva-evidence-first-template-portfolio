<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Evidence-first decision card">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFCF7"/><stop offset="1" stop-color="#FFF7ED"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102A43" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#wash)"/>
  
      <circle cx="980" cy="90" r="210" fill="#FF6B35" opacity=".13"/><circle cx="80" cy="980" r="250" fill="#2F6BFF" opacity=".1"/>
      <rect x="76" y="70" width="244" height="54" rx="27" fill="#FF6B35"/><text x="198" y="106" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EVIDENCE FIRST</text>
      <text x="76" y="224" font-family="Georgia, serif" font-size="70" font-weight="700" fill="#172B4D" text-anchor="start">Fitment is a</text><text x="76" y="306" font-family="Georgia, serif" font-size="70" font-weight="700" fill="#172B4D" text-anchor="start">decision, not a guess.</text>
      <text x="78" y="372" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="400" fill="#627D98" text-anchor="start" letter-spacing="0">A reusable compatibility research card</text>
      
  <rect x="76" y="438" width="928" height="142" rx="22" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="138" cy="509" r="32" fill="#102A43"/>
  <text x="138" y="518" font-family="Trebuchet MS, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">A</text>
  <text x="192" y="496" font-family="Trebuchet MS, sans-serif" font-size="25" font-weight="800" fill="#172B4D" text-anchor="start" letter-spacing="0">PRIMARY SOURCE</text>
  <text x="192" y="532" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="400" fill="#627D98" text-anchor="start" letter-spacing="0">Manufacturer catalog / revision date</text>

      
  <rect x="76" y="604" width="928" height="142" rx="22" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="138" cy="675" r="32" fill="#102A43"/>
  <text x="138" y="684" font-family="Trebuchet MS, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">B</text>
  <text x="192" y="662" font-family="Trebuchet MS, sans-serif" font-size="25" font-weight="800" fill="#172B4D" text-anchor="start" letter-spacing="0">CROSS-CHECK</text>
  <text x="192" y="698" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="400" fill="#627D98" text-anchor="start" letter-spacing="0">Independent catalog / application note</text>

      <rect x="76" y="804" width="928" height="174" rx="26" fill="#102A43"/>
      <text x="116" y="860" font-family="Trebuchet MS, sans-serif" font-size="20" font-weight="800" fill="#C6F6D5" text-anchor="start" letter-spacing="2">DECISION</text>
      <text x="116" y="923" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="start">Conditional - verify production month</text>
      <text x="116" y="958" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="400" fill="#D9E2EC" text-anchor="start" letter-spacing="0">before confirming compatibility.</text>
    
</svg>